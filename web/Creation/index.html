<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset=UTF-8>

    <meta name=keywords content />
    <meta name=description content />
    <meta name=author content />

    <!-- HTML Meta Tags -->
    <title>Thai Obbies Website</title>
    <meta name="description" content="Website for Thai Obby Community">

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://thaiobbieswebsite.vercel.app/">
    <meta property="og:title" content="Thai Obbies Website">
    <meta property="og:description" content="Website for Thai Obby Community">
    <meta property="og:image" content="../images/TOC.png">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="thaiobbieswebsite.vercel.app">
    <meta property="twitter:url" content="https://thaiobbieswebsite.vercel.app/">
    <meta name="twitter:title" content="Thai Obbies Website">
    <meta name="twitter:description" content="Website for Thai Obby Community">
    <meta name="twitter:image" content="/images/TOC.png">

    <link rel="shortcut icon" href=/images/TOC.png type=image/x-icon>
    <link rel="stylesheet" href="/style/leaderboard.css">
    <link rel="stylesheet" href="/style/main.css">
    <link rel="stylesheet" href="/style/star.css">
    <link rel="stylesheet" href="/style/list.css">
    <link rel="stylesheet" href="/style/tabs.css">
    <link rel="stylesheet" href="/style/creation.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <script type="module" src="/scripts/ListManager.js"></script>
</head>

<body class="creation-page">
    <div id="page-loader">
        <div class="loader-ring"></div>
        <p>Loading...</p>
    </div>
    <div class="night">
        <div class="shooting-stars">
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>
    </div>
    <div id=navbar>
        <div id=navbar-logo>
            <img src=/images/TOC.png alt=TOC>
            <div id="navbar-links">
                <a href="/index.html" aria-label="Home"><i class="fas fa-home"></i>
                    <p>Home</p>
                </a>
                <a href="/web/Leaderboard/index.html"><i class="fas fa-trophy"></i>
                    <p>Leaderboard</p>
                </a>
                <a href="/web/The List Obbies/index.html"><i class="fas fa-list"></i>
                    <p>List</p>
                </a>
                <a href="/web/Creation/index.html"><i class="fa-solid fa-hammer"></i>
                    <p>Creation</p>
                </a>
            </div>
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div id=navbar-links>
            <a href="/web/Credit/index.html"><i class="fas fa-users"></i>
                <p>Credits</p>
            </a>
            <a href=https://discord.gg/SWsqxZ9CTm><i class="fab fa-discord"></i>
                <p>Discord Server</p>
            </a>
            <a
                href="https://docs.google.com/spreadsheets/d/1XLUy2jmo9XKshRr_qkfkvByQ9RBAROWzpPADDJ88rGw/edit?gid=1463707024#gid=1463707024">
                <i class="fab fa-google"></i>
                <p>List Sheets</p>
            </a>
        </div>
    </div>
    <main id="list-container" class="creation-shell">
        <header class="creation-heading">
            <header class="heading">
                <p class="eyebrow">THAI OBBIES COMMUNITY</p>
            </header>
            <h1>Creation Obbies</h1>
        </header>
        <div class="creation-layout">
            <section class="creation-browser" aria-label="Creation list">
                <div class="creation-browser-tools">
                    <div id="sections" class="creation-tabs" role="tablist" aria-label="Verification status">
                        <button class="section-button" type="button" role="tab"
                            data-section="creation-verified-content">Verified</button>
                        <button class="section-button" type="button" role="tab"
                            data-section="creation-unverified-content">Unverified</button>
                    </div>
                    <label class="creation-search">
                        <span>Search creations</span>
                        <div class="creation-result-line">Towers/Obby: <span id="creation-count">0</span></div>
                        <input id="creation-search" type="search" placeholder="Name, creator, difficulty..."
                            autocomplete="off">
                    </label>
                </div>
                <div id="content" class="creation-results">
                    <div id="creation-verified-content" role="tabpanel" aria-label="Verified creations"></div>
                    <div id="creation-unverified-content" role="tabpanel" aria-label="Unverified creations"></div>
                </div>
            </section>
            <section id="creation-detail" class="creation-detail" aria-live="polite">
                <div class="creation-detail-empty">
                    <span class="creation-empty-mark">TOC</span>
                    <p>No creation selected.</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        function toggleMenu() {
            const hamburger = document.querySelector('.hamburger');
            const navbarLinks = document.getElementById('navbar-links');

            hamburger.classList.toggle('active');
            navbarLinks.classList.toggle('active');
        }

        // Close menu when clicking on a link (mobile)
        document.querySelectorAll('#navbar-links a').forEach(link => {
            link.addEventListener('click', () => {
                const hamburger = document.querySelector('.hamburger');
                const navbarLinks = document.getElementById('navbar-links');

                if (window.innerWidth <= 768) {
                    hamburger.classList.remove('active');
                    navbarLinks.classList.remove('active');
                }
            });
        });
        window.addEventListener('load', () => {
            document.querySelector('#page-loader').classList.add('loaded');
        });
    </script>
</body>
